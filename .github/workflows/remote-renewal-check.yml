name: Remote session renewal check
on:
  push:
    branches: [rivet/yv272-renewal-check-20261004]
    paths:
      - .github/workflows/remote-renewal-check.yml
      - validation/remote-renewal-check.py
permissions:
  contents: write
jobs:
  remote-renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 2b5530f3a46276bceb08fcf4f5e1ab430630fe55
          path: product
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: product
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce and repair expired remote renewal
        working-directory: product
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name woahwhattheheck
          git config user.email 293286387+woahwhattheheck@users.noreply.github.com
          python ../control/validation/remote-renewal-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-renewal-evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 14
