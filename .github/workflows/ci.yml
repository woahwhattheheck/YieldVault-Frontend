name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # Fail the job on policy-defined critical dependency findings / disallowed licenses.
      - name: Dependency vulnerability and license gate
        run: npm run audit:deps
      - run: npm test
      - run: npm run build
      - name: Production security header smoke test
        run: npm run smoke:headers
