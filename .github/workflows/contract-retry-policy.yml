name: Check contract retry policy
on:
  push:
    branches: [validation/contract-retry-policy-20261004]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f84efcb7ee69c2a14ce9826a7b675797b928ebe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install the existing dependencies and record source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          node --version > evidence/runtime.txt
          npm --version >> evidence/runtime.txt
          npm install --no-audit --no-fund > evidence/install.log 2>&1
          npm ls react react-dom vitest vite jsdom typescript @testing-library/react > evidence/dependencies.txt
          cp package-lock.json evidence/resolved-package-lock.json
      - name: Run the four maintained contract and component files
        shell: bash
        run: |
          set -euo pipefail
          npm test -- test/components/DepositForm.contract.test.jsx test/contracts/schema.test.js test/services/apiAdapter.test.js test/components/ApiErrorState.test.tsx --maxWorkers=1 --reporter=json --outputFile=evidence/focused.json > evidence/focused.log 2>&1
          cat evidence/focused.log
          python3 - <<'PY'
          import json
          d = json.load(open('evidence/focused.json'))
          assert d['numFailedTests'] == 0 and d['numPendingTests'] == 0, d
          assert d['numPassedTests'] > 13, d
          print('Combined maintained cases:', d['numPassedTests'], 'passed, 0 failed, 0 pending')
          PY
      - name: Build the exact combined source
        shell: bash
        run: |
          set -euo pipefail
          npm run build > evidence/build.log 2>&1
          cat evidence/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-ui-composed-head
          path: evidence
          retention-days: 14
